# The wulin v3 Ruby policy: the floor is 3.4 (the gemspec), the default is 4.0. Tests run on both,
# each on the newest patch of its line through the floating tag; anything else runs on the default.
image: ruby:$RUBY_VERSION

variables:
  RUBY_VERSION: "4.0"

cache:
  key:
    prefix: ruby-$RUBY_VERSION
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

stages:
  - lint
  - test

before_script:
  - bundle config set --local path vendor/bundle
  - bundle install --jobs $(nproc)

lint:
  stage: lint
  script:
    - bundle exec standardrb

rspec:
  stage: test
  parallel:
    matrix:
      - RUBY_VERSION: ["3.4", "4.0"]
  script:
    - bundle exec rspec
